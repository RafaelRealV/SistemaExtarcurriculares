<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>
    <link rel="stylesheet" href="Estilos/Adminnistracion_styles.css">
</head>
<body>

    <div class="divAdministracion">
        <div id="divBarraLateral">
            <h3>Lista de Actividades</h3>
            <nav>
                <a href="administrador.html">Actividades</a>
                <a href="adminOrganizador.html">Organizadores</a>
                <a href="adminAlumnos.html">Alumnos</a>
                <a href="#">Inicio</a>
            </nav>
        </div>

        <div id="divPrincipal">

            <header>
                <h2>⚙️ Panel de Administrador</h2>
                    <button id="btnCerrarSesion" onclick="cerrarSesion()">Cerrar Sesión</button>
            </header>

            <div class="contenido">
                
                <div id="divListado" class="cartaActividad">
                    <h3>Sin Organizadores</h3>
                </div>

                <div class="divFormulario">
                    <h3>Crear / Editar Organizador</h3>
                    <input type="hidden" id="idOrganizador">

                    <input type="text" id="nombre" placeholder="Nombre">
                    <input type="text" id="correo" placeholder="correo">
                    <input type="password" id="password" placeholder="Contraseña">


                    <button onclick="guardarOrganizador()">Guardar</button>
                </div>

            </div>
        </div>
    </div>

    <script src="Scripts/db.js"></script>
    <script src="Scripts/admin.js"></script>

     <script>
        inicializarDB();

        // Validar acceso
        const usuario = JSON.parse(localStorage.getItem("usuarioActual"));

        if (!usuario || usuario.rol !== "administrador") {
            alert("Acceso no autorizado");
            window.location.href = "login.html";
        }

        // Cargar datos
        listaOrganizadores();
    </script>
    
</body>
</html>
