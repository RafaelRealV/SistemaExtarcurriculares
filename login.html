<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="Estilos/index_style.css">
    <link rel="stylesheet" href="Estilos/login_style.css">
</head>

<body>
    <!-- HEADER -->
    <header>
        <div class="logo">
            <div class="icono">
                <img src="img/logo Bordeado.png" alt="">
            </div>

            <div>
                <div class="logo-texto">Extracurriculares</div>
                <div class="logo-subtexto">UNISIERRA</div>
            </div>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Actividades</a>
        </nav>
    </header>

    <main class="login-principal">
        <div class="login-content">
            <div class="login-box">
                <h3>Bienvenido de nuevo</h3>
                <p class="login-sub">Ingresa tus datos para continuar</p>

                <div class="select-rol" id="select-rol">
                    <button class="rol-btn active" data-role="alumno">Alumno</button>
                    <button class="rol-btn" data-role="organizador">Organizador</button>
                </div>

                <!-- Formulario de inicio de sesión -->
                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="matricula">Matricula / Ususario</label>
                        <input type="text" id="matricula" name="matricula" placeholder="Ej. 22050015"
                            autocomplete="username" required>
                        <span class="input-error" id="err-matricula"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-pass-wrap">
                            <input type="password" id="password" name="password" placeholder="••••••••"
                                autocomplete="current-password" required>
                            <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar contraseña">👁</button>
                        </div>
                        <span class="input-error" id="err-pass"></span>
                    </div>

                    <div class="form-opcion">
                        <label class="check-label">
                            <input type="checkbox" id="recordar"> Recordarme
                        </label>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div id="error-msg" class="error-msg" style="display:none;">
                        Usuario o contraseña incorrectos.
                    </div>

                    <button type="submit" class="btn-login" id="btn-login">Iniciar Sesión</button>
                </form>
                <div class="divider"><span>o</span></div>

                <p class="register-link">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                </p>

            </div>
        </div>
    </main>

        <!-- FOOTER -->
        <footer>
            <p>© 2026 <span>Sistema Escolar</span></p>
        </footer>

    <script src="Scripts/db.js"></script>
    <script src="Scripts/login.js"></script>

    <script>
            // Toggle mostrar/ocultar contraseña
    document.getElementById('toggle-pass').addEventListener('click', function () {
        const input = document.getElementById('password');
        const esPassword = input.type === 'password';
        input.type = esPassword ? 'text' : 'password';
        this.textContent = esPassword ? '🙈' : '👁';
    });

    // Cambio de rol (alumno / organizador)
    document.querySelectorAll('.rol-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.rol-btn').forEach(function (b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            // Exponer el rol seleccionado para login.js
            document.getElementById('login-form').dataset.rol = btn.dataset.role;
            document.getElementById('matricula').placeholder =
                btn.dataset.role === 'organizador' ? 'Ej. ORG-001' : 'Ej. 22050015';
        });
    });
    </script>

</body>

</html>
